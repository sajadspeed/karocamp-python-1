{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="mb-4">Register User</h2>

                <form method="post">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Username</label>
                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Password</label>
                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Name</label>
                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Age</label>
                            <input
                                type="number"
                                name="age"
                                class="form-control"
                                min="1"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <label class="form-label">City</label>
                            <input
                                type="text"
                                name="city"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Skills
                            </label>
                            <input
                                type="text"
                                name="skills"
                                class="form-control"
                                placeholder="Python, Django, Git"
                            >
                            <div class="form-text">
                                Separate skills with commas.
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input
                                    type="checkbox"
                                    name="is_verified"
                                    class="form-check-input"
                                    id="verified"
                                >
                                <label class="form-check-label" for="verified">
                                    Is user verified?
                                </label>
                            </div>
                        </div>

                    </div>

                    <div class="mt-4">
                        <button class="btn btn-primary">
                            Register
                        </button>

                        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
