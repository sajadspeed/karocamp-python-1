{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="mb-4">Update Profile</h2>

                <form method="post">

                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ user['profile']['name'] }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Age</label>
                        <input
                            type="number"
                            name="age"
                            class="form-control"
                            value="{{ user['profile']['age'] }}"
                            min="1"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">City</label>
                        <input
                            type="text"
                            name="city"
                            class="form-control"
                            value="{{ user['profile']['city'] }}"
                            required
                        >
                    </div>

                    <button class="btn btn-primary">
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('user_detail', username=user['username']) }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
