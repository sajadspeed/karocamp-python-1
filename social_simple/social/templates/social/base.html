<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>مینی سوشال‌مدیا</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <style>
    body { 
        background-color: #f0f2f5; 
        font-family: 'Vazirmatn', sans-serif; 
    }
    .navbar { background-color: #ffffff; }
    .card { border-radius: 12px; border: none; }
    .text-primary-custom { color: #1877f2; }
    .bg-primary-custom { background-color: #1877f2; color: #fff;}
    .btn-primary { background-color: #1877f2; border-color: #1877f2; }
    .btn-primary:hover { background-color: #166fe5; border-color: #166fe5; }
    
    .post-avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background-color: #e4e6eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        color: #606770;
        font-size: 1.2rem;
    }
    .tag-badge {
        background-color: #e7f3ff;
        color: #1877f2;
        transition: 0.2s;
        text-decoration: none;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
    }
    .tag-badge:hover { background-color: #dbeaff; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg mb-4 shadow-sm py-3 sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary-custom fs-4" href="{% url 'social:post_list' %}">سوشال‌مدیا</a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto align-items-center">
          {% if user.is_authenticated %}
            <li class="nav-item ms-3">
                <a class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" href="{% url 'social:create_post' %}">+ پست جدید</a>
            </li>
            <li class="nav-item ms-2">
                <form action="{% url 'users:logout' %}" method="post" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-light rounded-pill px-3 fw-bold text-danger border">خروج ({{ user.username }})</button>
                </form>
            </li>
          {% else %}
            <li class="nav-item ms-2"><a class="btn btn-outline-primary rounded-pill px-4 fw-bold" href="{% url 'users:login' %}">ورود</a></li>
            <li class="nav-item ms-2"><a class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm" href="{% url 'users:register' %}">ثبت‌نام</a></li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
