{% extends 'social/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card mt-5 shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h3 class="fw-bold">خوش آمدید</h3>
                    <p class="text-muted">لطفاً وارد حساب کاربری خود شوید</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label text-secondary fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-primary w-100 py-2 mt-3 rounded-pill fw-bold fs-5 shadow-sm">ورود</button>
                </form>
                <div class="text-center mt-4">
                    <p class="text-muted small">حساب کاربری ندارید؟ <a href="{% url 'users:register' %}" class="text-decoration-none fw-bold">ثبت‌نام کنید</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
